name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore MaquinaCafe.slnx

      - name: Compilar solución
        run: dotnet build MaquinaCafe.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test MaquinaCafe.slnx --configuration Release --no-build --logger "console;verbosity=normal"
